name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Validate and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate tag and package version
        run: node scripts/release-tag.mjs "$RELEASE_TAG" "$(node -p "require('./package.json').version")"
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run prepare:ocr
      - run: npm run generate:license-report -- --check
      - run: npm run validate:repo -- --require-publishable
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run verify:ocr
      - run: npm run verify:multi-event
      - run: npm run verify:schedule-table
      - run: npm run verify:shift-roster
      - run: npm run test:cross-browser
      - run: npm run test:a11y
      - run: npm run build
      - run: npm run validate:dist
      - run: npm run validate:runtime-network
      - run: npm run validate:production-mocks
      - run: npm run verify:pages-base
      - run: npm run package:release -- --require-publishable --tag "$RELEASE_TAG"
      - run: npm run validate:release -- --require-publishable --tag "$RELEASE_TAG"
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_channel="$(node scripts/release-tag.mjs "$RELEASE_TAG" "$(node -p "require('./package.json').version")")"
          release_flags=(--draft --verify-tag --generate-notes --latest=false)
          if [[ "$release_channel" == "prerelease" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "release/snap2cal-${RELEASE_TAG}-static-site.zip" \
            "release/snap2cal-${RELEASE_TAG}-SHA256SUMS.txt" \
            "${release_flags[@]}" \
            --title "Snap2Cal $RELEASE_TAG"
