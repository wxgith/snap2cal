name: Bug report
description: Report repeatable incorrect behavior using synthetic or fully redacted data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not attach real schedules, rosters, private chats, contact details, internal organization information, credentials, or other unredacted data.
  - type: input
    id: version
    attributes:
      label: Snap2Cal version
      description: Use the version shown in the application footer or the commit identifier.
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      options:
        - Text event
        - Image event
        - Timetable
        - Shift roster
        - Shared interface or build tooling
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chromium, Firefox, WebKit/Safari equivalent, and version if known
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows, macOS, Linux, iOS, or Android
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal synthetic input and numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Relevant console error
      description: Remove local paths, tokens, URLs with private data, and unrelated output.
      render: shell
  - type: dropdown
    id: synthetic-reproduction
    attributes:
      label: Can this be reproduced with synthetic data?
      options:
        - Yes
        - Not yet; I will not upload private data
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not uploaded a real staff roster, real timetable, private chat, phone number, address, internal organization information, or any other unredacted personal data.
          required: true
